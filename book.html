<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Consultation | Olfindo Immigration Consulting</title>
<style>
  :root{
    --navy:#161616;
    --navy-deep:#0a0a0a;
    --gold:#5f9c52;
    --gold-bright:#78b56a;
    --paper:#f2f2f0;
    --line:#e1e1de;
    --mono: ui-monospace, "SF Mono", "IBM Plex Mono", monospace;
    --display: -apple-system, "system-ui", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --body: -apple-system, "system-ui", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--body); background:var(--paper); color:var(--navy-deep);
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:50; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .topbar .brand{display:flex; align-items:center; gap:12px;}
  .logo-box{background:#fff; border:1px solid var(--line); border-radius:9px; padding:5px 12px; display:inline-flex; align-items:center; line-height:0;}
  .logo-box img{height:24px; width:auto; display:block;}
  .brand-suffix{font-family:var(--display); font-size:13px; color:#a9b3ba; font-weight:500;}
  .topbar-actions{display:flex; align-items:center; gap:16px;}
  .topbar-link{color:#dfe6ea; font-size:12.5px; font-weight:600; text-decoration:none; background:none; border:none; cursor:pointer; font-family:var(--body); display:inline-flex; align-items:center; gap:5px; opacity:.9;}
  .topbar-link:hover{opacity:1; color:#fff;}
  .shell{max-width:900px; margin:0 auto; padding:36px 20px 80px;}
  .head{margin-bottom:22px;}
  .head h1{font-family:var(--display); font-weight:800; font-size:28px; margin:0 0 10px; color:var(--navy-deep);}
  .head p{margin:0; color:#5b6b78; font-size:14px; max-width:640px; line-height:1.6;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .calendly-inline-widget{min-width:280px; height:820px;}
  @media(max-width:700px){
    .topbar{padding:12px 16px;}
    .brand-suffix{display:none;}
    .shell{padding:22px 14px 60px;}
    .head h1{font-size:22px;}
    .calendly-inline-widget{height:900px;}
  }
</style>
</head>
